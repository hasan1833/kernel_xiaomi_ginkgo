name: Build ginkgo kernel (kprobes bisect)

# Known: 1-baseline and 2-modules boot. 3-modules-kprobes bootloops.
# All variants below have MODULES + KPROBES on. Flash and see which boot:
#   4-kprobes-ksu-patched : KernelSU-Next's own kprobe code (selinux_hide) disabled
#   5-kprobes-nolto       : full LTO off
#   6-kprobes-noksu       : KernelSU off (tests plain kprobes only)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: Frenzy169/kernel_xiaomi_ginkgo
  KERNEL_REF: 9cdf251be3de2ec02ef8b5239fbc048962174e7b
  DEFCONFIG: vendor/ginkgo-perf_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [4-kprobes-ksu-patched, 5-kprobes-nolto, 6-kprobes-noksu]
    steps:
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /mnt/kswap || sudo dd if=/dev/zero of=/mnt/kswap bs=1M count=8192
          sudo chmod 600 /mnt/kswap
          sudo mkswap /mnt/kswap
          sudo swapon /mnt/kswap || true
          free -m

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zip \
            device-tree-compiler python3 cpio libncurses-dev

      - name: Checkout kernel source
        run: |
          git clone --no-checkout https://github.com/${KERNEL_REPO} kernel
          cd kernel
          git fetch --depth=1 origin ${KERNEL_REF}
          git checkout FETCH_HEAD

      - name: Fetch toolchains
        run: |
          mkdir -p toolchain && cd toolchain
          git clone --depth=1 https://gitlab.com/nekoprjkt/aosp-clang clang
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64-linux-android-4.9
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git arm-linux-androideabi-4.9
          ln -sf arm-linux-androideabi-ld arm-linux-androideabi-4.9/bin/arm-linux-gnueabi-ld
          ln -sf arm-linux-androideabi-ld arm-linux-androideabi-4.9/bin/arm-linux-gnueabihf-ld
          ./clang/bin/clang --version | head -1

      - name: Add KernelSU-Next
        working-directory: kernel
        run: |
          git clone -b legacy-susfs https://github.com/Frenzy169/KernelSU-Next KernelSU-Next
          (cd drivers && ln -sf ../KernelSU-Next/kernel kernelsu)
          grep -q kernelsu drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          D=arch/arm64/configs/${DEFCONFIG}
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/; s/CONFIG_KSU_MANUAL_HOOK=n/CONFIG_KSU_MANUAL_HOOK=y/' $D

      - name: Patch KernelSU-Next kprobe use (variant 4 only)
        if: matrix.variant == '4-kprobes-ksu-patched'
        working-directory: kernel
        run: |
          F=KernelSU-Next/kernel/feature/selinux_hide.c
          grep -n "CONFIG_KPROBES" $F
          sed -i 's/#if defined(CONFIG_KPROBES)/#if 0 \/* kprobes disabled *\//' $F
          echo "--- after:"; grep -n "CONFIG_KPROBES\|#if 0" $F

      - name: Configure (${{ matrix.variant }})
        working-directory: kernel
        run: |
          TC="$GITHUB_WORKSPACE/toolchain"
          export PATH="$TC/clang/bin:$TC/aarch64-linux-android-4.9/bin:$TC/arm-linux-androideabi-4.9/bin:$PATH"
          export KBUILD_BUILD_USER=Frenzy KBUILD_BUILD_HOST=KazuyaProject
          MK="make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_COMPAT=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "MK=$MK" >> $GITHUB_ENV
          mkdir -p out
          $MK $DEFCONFIG
          cp out/.config ../config.before
          scripts/config --file out/.config \
            -e MODULES -e MODULE_UNLOAD -e UNUSED_SYMBOLS -e KPROBES \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d TRIM_UNUSED_KSYMS -d SECURITY_LOCKDOWN_LSM
          case "${{ matrix.variant }}" in
            5-kprobes-nolto)
              scripts/config --file out/.config -d LTO_CLANG -e LTO_NONE -d LTO ;;
            6-kprobes-noksu)
              scripts/config --file out/.config -d KSU ;;
          esac
          $MK olddefconfig
          cp out/.config ../config.after
          diff <(grep -v '^#' ../config.before | sort) <(grep -v '^#' out/.config | sort) || true
          grep -E "^(# )?CONFIG_(KPROBES|KSU|LTO|LTO_CLANG)[ =]" out/.config

      - name: Build
        working-directory: kernel
        run: |
          TC="$GITHUB_WORKSPACE/toolchain"
          export PATH="$TC/clang/bin:$TC/aarch64-linux-android-4.9/bin:$TC/arm-linux-androideabi-4.9/bin:$PATH"
          export KBUILD_BUILD_USER=Frenzy KBUILD_BUILD_HOST=KazuyaProject
          export LD_LIBRARY_PATH="$TC/clang/lib:${LD_LIBRARY_PATH:-}"
          $MK -j$(nproc) Image.gz-dtb dtbo.img 2>&1 | tee ../build.log | tail -n 40
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Frenzy169/AnyKernel3 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/
          cp kernel/out/arch/arm64/boot/dtbo.img AK3/
          cd AK3 && zip -r9 "../Kazuya-Ginkgo-${{ matrix.variant }}.zip" * -x '*.git*' README.md '*placeholder'

      - uses: actions/upload-artifact@v4
        with:
          name: Kazuya-Ginkgo-${{ matrix.variant }}
          path: |
            Kazuya-Ginkgo-${{ matrix.variant }}.zip
            config.after
            build.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: FAILED-${{ matrix.variant }}-log
          path: |
            build.log
            config.after
