name: Build Kazuya (KSU-Next + SuSFS + modules + kprobes)

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Enable loadable kernel modules (no signature/version checks)"
        type: boolean
        default: true
      kprobes:
        description: "Enable kprobes/kretprobes"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Frenzy169/kernel_xiaomi_ginkgo
          ref: "16"
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            lld llvm python3 zip git curl cpio device-tree-compiler \
            libncurses-dev xz-utils

      # Same toolchain set the Kazuya author uses in his own build.sh
      - name: Get toolchains
        run: |
          git clone --depth=1 https://gitlab.com/nekoprjkt/aosp-clang "$HOME/clang"
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git "$HOME/gcc64"
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git "$HOME/gcc32"
          export PATH="$HOME/clang/bin:$PATH"
          clang --version | head -1

      # Same KernelSU-Next the Kazuya author ships (legacy-susfs, manual hooks)
      - name: Add KernelSU-Next (Frenzy169 legacy-susfs)
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Frenzy169/KernelSU-Next/legacy-susfs/kernel/setup.sh" | bash -s legacy-susfs
          ls -l drivers/kernelsu
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Configure
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang/lib:$LD_LIBRARY_PATH"
          export KBUILD_BUILD_USER="Frenzy"
          export KBUILD_BUILD_HOST="KazuyaProject"
          M="make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_COMPAT=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          $M vendor/ginkgo-perf_defconfig
          C="scripts/config --file out/.config"

          # KernelSU-Next + SuSFS, manual hooks (exactly like Kazuya)
          $C -e KSU -e KSU_MANUAL_HOOK -e KSU_SUSFS -d KSU_KPROBES_HOOK

          if [ "${{ inputs.modules }}" = "true" ]; then
            # Loadable modules with no restrictions
            $C -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_LOAD -e MODULE_FORCE_UNLOAD
            $C -d MODVERSIONS -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL
          fi

          if [ "${{ inputs.kprobes }}" = "true" ]; then
            $C -e KALLSYMS -e KALLSYMS_ALL
            $C -e KPROBES -e KRETPROBES -e KPROBE_EVENTS
            $C -e OPTPROBES
          fi

          $M olddefconfig
          grep -E "^CONFIG_(LTO_CLANG|THINLTO|CFI_CLANG|MODULES|MODULE_UNLOAD|MODULE_FORCE_LOAD|MODVERSIONS|MODULE_SIG|KPROBES|KRETPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL|KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SUSFS|LOCALVERSION)=" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config
          grep -q "^CONFIG_KSU_SUSFS=y" out/.config
          if [ "${{ inputs.modules }}" = "true" ]; then
            grep -q "^CONFIG_MODULES=y" out/.config
            ! grep -q "^CONFIG_MODULE_SIG_FORCE=y" out/.config
            ! grep -q "^CONFIG_MODVERSIONS=y" out/.config
          fi
          if [ "${{ inputs.kprobes }}" = "true" ]; then
            grep -q "^CONFIG_KPROBES=y" out/.config
          fi

      - name: Build
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang/lib:$LD_LIBRARY_PATH"
          export KBUILD_BUILD_USER="Frenzy"
          export KBUILD_BUILD_HOST="KazuyaProject"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- Image.gz-dtb dtbo.img 2>&1 | tail -n 300
          test -f out/arch/arm64/boot/Image.gz-dtb
          test -f out/arch/arm64/boot/dtbo.img

      # Kazuya's own AnyKernel3 (flashes dtbo too)
      - name: Package flashable zip
        run: |
          git clone --depth=1 https://github.com/Frenzy169/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          cp out/arch/arm64/boot/dtbo.img ak3/
          cd ak3
          zip -r9 ../Kazuya-KSUN-SuSFS-custom-ginkgo.zip * -x '*.git*' README.md '*placeholder'

      - uses: actions/upload-artifact@v4
        with:
          name: Kazuya-KSUN-SuSFS-custom-ginkgo
          path: Kazuya-KSUN-SuSFS-custom-ginkgo.zip
