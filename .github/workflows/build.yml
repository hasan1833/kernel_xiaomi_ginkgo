name: Build Kazuya Ginkgo (KSU-Next + SuSFS + modules + kprobes)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      KBUILD_BUILD_USER: Frenzy
      KBUILD_BUILD_HOST: KazuyaProject
      DEFCONFIG: vendor/ginkgo-perf_defconfig
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: Frenzy169/kernel_xiaomi_ginkgo
          ref: "16"
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 zip git curl cpio lz4 xz-utils

      - name: Get toolchains (same as the reference build.sh)
        run: |
          git clone --depth=1 https://gitlab.com/nekoprjkt/aosp-clang "$HOME/toolchain/clang"
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git "$HOME/toolchain/gcc64"
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git "$HOME/toolchain/gcc32"
          "$HOME/toolchain/clang/bin/clang" --version | head -1

      - name: Add KernelSU-Next (Frenzy169 legacy-susfs, same as reference)
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          curl -kLSs "https://raw.githubusercontent.com/Frenzy169/KernelSU-Next/legacy-susfs/kernel/setup.sh" | bash -s legacy-susfs
          ls -l drivers/kernelsu
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' arch/arm64/configs/$DEFCONFIG
          sed -i 's/CONFIG_KSU_MANUAL_HOOK=n/CONFIG_KSU_MANUAL_HOOK=y/g' arch/arm64/configs/$DEFCONFIG

      - name: Configure (reference defconfig + modules/drivers/kprobes)
        run: |
          export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchain/clang/lib:$LD_LIBRARY_PATH"
          mkdir -p out
          make O=out ARCH=arm64 $DEFCONFIG

          C="scripts/config --file out/.config"

          # --- loadable kernel modules: no signature, no CRC check, force load/unload ---
          $C -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_LOAD -e MODULE_FORCE_UNLOAD
          $C -d MODVERSIONS -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL

          # --- kprobes / uprobes / tracing (needed by most kernel drivers) ---
          $C -e KPROBES -e KRETPROBES
          $C -e FTRACE -e KPROBE_EVENTS -e UPROBES -e UPROBE_EVENTS -e BPF_EVENTS

          # --- kernel symbol + memory access for drivers ---
          $C -e KALLSYMS -e KALLSYMS_ALL
          $C -e DEVMEM -d STRICT_DEVMEM -e PROC_KCORE -e DEBUG_FS
          $C -e IKCONFIG -e IKCONFIG_PROC

          make O=out ARCH=arm64 olddefconfig

          echo "=== resulting config ==="
          grep -E "^CONFIG_(MODULES|MODULE_UNLOAD|MODULE_FORCE_LOAD|MODULE_FORCE_UNLOAD|KPROBES|KRETPROBES|KPROBE_EVENTS|UPROBES|UPROBE_EVENTS|FTRACE|KALLSYMS_ALL|DEVMEM|PROC_KCORE|DEBUG_FS|KSU|KSU_MANUAL_HOOK|KSU_SUSFS[A-Z_]*|LTO_CLANG)=" out/.config
          grep -E "MODULE_SIG|MODVERSIONS|STRICT_DEVMEM" out/.config

          # fail early if anything did not stick
          for o in MODULES MODULE_FORCE_LOAD KPROBES KRETPROBES KPROBE_EVENTS UPROBES KALLSYMS_ALL DEVMEM PROC_KCORE \
                   KSU KSU_MANUAL_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                   KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "MISSING CONFIG_$o"; exit 1; }
          done
          ! grep -q "^CONFIG_MODULE_SIG=y" out/.config
          ! grep -q "^CONFIG_MODVERSIONS=y" out/.config

      - name: Build
        run: |
          export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchain/clang/lib:$LD_LIBRARY_PATH"
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb \
            dtbo.img 2>&1 | tail -n 400
          test -f out/arch/arm64/boot/Image.gz-dtb
          test -f out/arch/arm64/boot/dtbo.img
          make O=out ARCH=arm64 kernelrelease

      - name: Package flashable zip (Frenzy169 AnyKernel3, same as reference)
        run: |
          git clone -q https://github.com/Frenzy169/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          git checkout master &> /dev/null
          ZIPNAME="Kazuya-Ginkgo-KSUNext-Modules-$(TZ=Asia/Jakarta date +"%Y%m%d-%H%M").zip"
          zip -r9 "../$ZIPNAME" * -x '*.git*' README.md *placeholder
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Kazuya-Ginkgo-KSUNext-Modules
          path: ${{ env.ZIPNAME }}
