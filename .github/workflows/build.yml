name: Build Kazuya Ginkgo (KSU-Next + SuSFS + modules + kprobes)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash   # = bash -eo pipefail, so a failing `make | tee` really fails the step
    env:
      KBUILD_BUILD_USER: Frenzy
      KBUILD_BUILD_HOST: KazuyaProject
      DEFCONFIG: vendor/ginkgo-perf_defconfig
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: Frenzy169/kernel_xiaomi_ginkgo
          ref: "16"
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 zip git curl cpio lz4 xz-utils

      - name: Get toolchains (same as the reference build.sh)
        run: |
          git clone --depth=1 https://gitlab.com "\$HOME/toolchain/clang"
          git clone --depth=1 -b lineage-19.1 https://github.com "\$HOME/toolchain/gcc64"
          git clone --depth=1 -b lineage-19.1 https://github.com "\$HOME/toolchain/gcc32"
          "\$HOME/toolchain/clang/bin/clang" --version | head -1

      - name: Add KernelSU-Next (Frenzy169 legacy-susfs, same as reference)
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          curl -kLSs "https://githubusercontent.com" | bash -s legacy-susfs
          ls -l drivers/kernelsu
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' arch/arm64/configs/\$DEFCONFIG
          sed -i 's/CONFIG_KSU_MANUAL_HOOK=n/CONFIG_KSU_MANUAL_HOOK=y/g' arch/arm64/configs/\$DEFCONFIG

      - name: Patch MSM display driver (needed because DEBUG_FS is on)
        run: |
          # sde_dbg_evtlog.o is only built with CONFIG_DEBUG_FS. The driver replaces all
          # tracepoints with empty stubs but forgot trace_sde_evtlog -> implicit declaration error.
          F=drivers/gpu/drm/msm/sde/sde_trace.h
          grep -q "define trace_sde_evtlog" \$F || \
            sed -i 's|^#define trace_sde_perf_set_qos_luts(...) {}|&\n#define trace_sde_evtlog(...) {}|' \$F
          grep -n "trace_sde_evtlog" \$F

      - name: Configure (reference defconfig + modules/drivers/kprobes)
        run: |
          export PATH="HOME/toolchain/clang/bin:HOME/toolchain/gcc64/bin:HOME/toolchain/gcc32/bin:PATH"
          export LD_LIBRARY_PATH="HOME/toolchain/clang/lib:LD_LIBRARY_PATH"
          mkdir -p out
          make O=out ARCH=arm64 \$DEFCONFIG

          C="scripts/config --file out/.config"

          # --- FIX: KALLSYMS_ALL "depends on DEBUG_KERNEL && KALLSYMS".
          # The defconfig has "# CONFIG_DEBUG_KERNEL is not set", so olddefconfig silently
          # dropped KALLSYMS_ALL. DEBUG_KERNEL has to be turned on first. ---
          \(C -e DEBUG_KERNEL\)C -e KALLSYMS -e KALLSYMS_ALL

          # --- loadable kernel modules: no signature, no CRC check, force load/unload ---
          \(C -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_LOAD -e MODULE_FORCE_UNLOAD\)C -d MODVERSIONS -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL

          # --- kprobes / uprobes / tracing (needed by most kernel drivers) ---
          \(C -e KPROBES -e KRETPROBES\)C -e FTRACE -e KPROBE_EVENTS -e UPROBES -e UPROBE_EVENTS -e BPF_EVENTS

          # --- memory access for drivers ---
          \(C -e DEVMEM -d STRICT_DEVMEM -e PROC_KCORE -e DEBUG_FS\)C -e IKCONFIG -e IKCONFIG_PROC

          make O=out ARCH=arm64 olddefconfig

          echo "=== resulting config ==="
          grep -E "^CONFIG_(DEBUG_KERNEL|KALLSYMS|KALLSYMS_ALL|MODULES|MODULE_UNLOAD|MODULE_FORCE_LOAD|MODULE_FORCE_UNLOAD|KPROBES|KRETPROBES|KPROBE_EVENTS|UPROBES|UPROBE_EVENTS|FTRACE|DEVMEM|PROC_KCORE|DEBUG_FS|KSU|KSU_MANUAL_HOOK|KSU_SUSFS[A-Z_]*|LTO_CLANG)=" out/.config || true
          grep -E "MODULE_SIG|MODVERSIONS|STRICT_DEVMEM" out/.config || true

          # fail early (and list EVERYTHING that is missing, not just the first one)
          missing=0
          for o in DEBUG_KERNEL KALLSYMS KALLSYMS_ALL MODULES MODULE_UNLOAD MODULE_FORCE_LOAD MODULE_FORCE_UNLOAD \
                   KPROBES KRETPROBES KPROBE_EVENTS UPROBES UPROBE_EVENTS DEVMEM PROC_KCORE DEBUG_FS \
                   KSU KSU_MANUAL_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                   KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG; do
            grep -q "^CONFIG_\$o=y" out/.config || { echo "MISSING CONFIG_\$o"; missing=1; }
          done
          for o in MODULE_SIG MODULE_SIG_FORCE MODVERSIONS STRICT_DEVMEM; do
            if grep -q "^CONFIG_\$o=y" out/.config; then echo "SHOULD BE OFF: CONFIG_\$o"; missing=1; fi
          done
          exit \$missing

      - name: Build
        run: |
          export PATH="HOME/toolchain/clang/bin:HOME/toolchain/gcc64/bin:HOME/toolchain/gcc32/bin:PATH"
          export LD_LIBRARY_PATH="HOME/toolchain/clang/lib:LD_LIBRARY_PATH"
          MK=(make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
              CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_COMPAT=arm-linux-androideabi-
              CLANG_TRIPLE=aarch64-linux-gnu-)

          if ! "\({MK[@]}" -j"\)(nproc --all)" Image.gz-dtb dtbo.img > out/build.log 2>&1; then
            echo "################ BUILD FAILED - first real errors ################"
            grep -n -E "error:|undefined (reference|symbol)|fatal error|\*\*\* \[" out/build.log | head -40 || true
            echo "################ re-running single-threaded to get a clean error ################"
            "\${MK[@]}" -j1 Image.gz-dtb dtbo.img 2>&1 | tail -n 60 || true
            exit 1
          fi
          tail -n 30 out/build.log
          test -f out/arch/arm64/boot/Image.gz-dtb
          test -f out/arch/arm64/boot/dtbo.img
          make O=out ARCH=arm64 kernelrelease | tee out/kernelrelease.txt

      - name: Package flashable zip (Frenzy169 AnyKernel3, same as reference)
        run: |
          git clone -q https://github.com AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          git checkout master &> /dev/null
          ZIPNAME="Kazuya-Ginkgo-KSUNext-Modules-\$(TZ=Asia/Jakarta date +"%Y%m%d-%H%M").zip"
          zip -r9 "../\$ZIPNAME" * -x '*.git*' README.md *placeholder
          echo "ZIPNAME=ZIPNAME" >> "GITHUB_ENV"

      - name: Collect module-build files (config, Module.symvers, release)
        run: |
          # Needed to compile your own .ko against exactly this kernel
          mkdir -p modbuild
          cp out/.config modbuild/config
          cp out/Module.symvers modbuild/ 2>/dev/null || true
          cp out/kernelrelease.txt modbuild/

      - uses: actions/upload-artifact@v4
        with:
          name: Kazuya-Ginkgo-KSUNext-Modules
          path: \${{ env.ZIPNAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: module-build-files
          path: modbuild/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            out/.config
            out/build.log
          if-no-files-found: ignore
          
